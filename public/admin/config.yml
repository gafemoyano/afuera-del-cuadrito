# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# SveltiaCMS Configuration
# Documentation: https://github.com/sveltia/sveltia-cms
# local_backend: true
backend:
  # name: git-gateway
  # branch: master
  name: github # Change to your backend (github, gitlab, gitea)
  repo: gafemoyano/afuera-del-cuadrito # Replace with your repository
  branch: master # or master, depending on your default branch

# Media files
media_folder: "public/images/uploads" # Where uploaded files will be stored
public_folder: "/images/uploads" # Public URL path for uploaded files

# Site configuration
site_url: https://afueradelcuadrito.com
logo:
  src: /images/logo.png

# Collections
collections:
  # Blog Posts
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/posts"
    create: true
    slug: "{{fields.title | slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Meta Title",
          name: "meta_title",
          widget: "string",
          required: false,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Language"
        name: "lang"
        widget: "select"
        options:
          - { label: "Español", value: "es" }
          - { label: "English", value: "en" }
        default: "es"
        hint: "Select the language of this post"
      - label: "Translation Key"
        name: "translationKey"
        widget: "string"
        required: false
        hint: "To link translations, use the same key for both Spanish and English versions (e.g., 'multispecies-dialogue')"
      - label: "Body"
        name: "body"
        widget: "markdown"
        editor_components: ["code-block", "image", "align-right", "indent-xl"]
  # Pages
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Meta Title",
          name: "meta_title",
          widget: "string",
          required: false,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        editor_components: ["code-block", "image", "align-right", "indent-xl"]

  # Special Pages (using file collection for singleton pages)
  - name: "special_pages"
    label: "Special Pages"
    files:
      - label: "About Page (Español)"
        name: "about"
        file: "src/content/about/-index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Meta Title",
              name: "meta_title",
              widget: "string",
              required: false,
            }
          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
            }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
          - label: "Language"
            name: "lang"
            widget: "select"
            options:
              - { label: "Español", value: "es" }
              - { label: "English", value: "en" }
            default: "es"
          - label: "Content"
            name: "body"
            widget: "markdown"
            editor_components:
              ["code-block", "image", "align-right", "indent-xl"]
      - label: "About Page (English)"
        name: "about_en"
        file: "src/content/about/-index-en.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Meta Title",
              name: "meta_title",
              widget: "string",
              required: false,
            }
          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
            }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
          - label: "Language"
            name: "lang"
            widget: "select"
            options:
              - { label: "Español", value: "es" }
              - { label: "English", value: "en" }
            default: "en"
          - label: "Content"
            name: "body"
            widget: "markdown"
            editor_components:
              ["code-block", "image", "align-right", "indent-xl"]

# Data output settings
output:
  omit_empty_optional_fields: true

# Editor settings
editor:
  preview: true

# Display URL for site preview
display_url: https://afueradelcuadrito.com
